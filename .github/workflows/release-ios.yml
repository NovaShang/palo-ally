# Archive the iOS app and upload it to App Store Connect for TestFlight, on the
# same `v*` tags as the Mac release (or by hand).
#
# Mirrors BentoTerm's ios-release.yml:
# - Signing is manual with an Apple Distribution certificate and the
#   "PaloAlly App Store" profile, both created through the App Store Connect
#   API (scripts/setup-ios-release-secrets.sh uploads them).
# - The upload reuses the API key the Mac notarization uses.
# - It runs on a released macOS: App Store Connect rejects builds whose
#   BuildMachineOSBuild is a beta OS (ITMS-90111), which rules out a beta dev Mac.
#
# Secrets: IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD, IOS_PROFILE_BASE64,
# ASC_NOTARY_KEY_ID, ASC_NOTARY_ISSUER_ID, ASC_NOTARY_KEY_P8_BASE64.
name: Release iOS app (TestFlight)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 0.1.3 (default: from the tag, or the project)"
        required: false

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 7M23245ZBD
      BUNDLE_ID: com.novashang.paloally
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          set -e
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$V" ]; then V="$(grep -m1 'MARKETING_VERSION' ios/App/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"; fi
          # TestFlight refuses a build number it has already seen for a version;
          # a UTC date.time stamp always grows and fits CFBundleVersion's limits.
          B="$(date -u +%y%m%d.%H%M)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$B" >> "$GITHUB_ENV"
          echo "PaloAlly $V ($B)"

      # The newest released Xcode 26 on the runner (the app needs the iOS 26 SDK).
      - name: Select Xcode
        run: |
          set -e
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then echo "::error::no Xcode 26 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          # The avatar's .metal shaders need the Metal toolchain, a separate
          # download since Xcode 26 that runner images don't preinstall.
          xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal -v

      - name: Check secrets
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_NOTARY_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_NOTARY_KEY_P8_BASE64 }}
        run: |
          missing=""
          for v in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing (run scripts/setup-ios-release-secrets.sh)"
            exit 1
          fi

      # A throwaway keychain holding only the distribution identity.
      - name: Signing keychain and profile
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/paloally-ios.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          P12="$RUNNER_TEMP/dist.p12"
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$P12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Xcode finds a profile by the UUID in its filename (both locations,
          # for older and newer Xcodes).
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"; cp "$PROFILE" "$DIR/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "installed $NAME ($UUID)"

      # Manual signing must be scoped to the app target: passing CODE_SIGN_STYLE
      # on the command line would also hit the Swift package targets, which
      # then fail with "does not support provisioning profiles". So patch
      # project.yml (CI-only; the committed file keeps Automatic for local
      # device builds) and regenerate the project.
      - name: Switch the app target to manual signing
        working-directory: ios/App
        run: |
          set -e
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("project.yml")
          s = p.read_text()
          block = (
              "        CODE_SIGN_STYLE: Manual\n"
              '        CODE_SIGN_IDENTITY: "Apple Distribution"\n'
              f'        PROVISIONING_PROFILE_SPECIFIER: "{os.environ["PROFILE_NAME"]}"\n'
              f'        DEVELOPMENT_TEAM: "{os.environ["TEAM_ID"]}"\n'
          )
          s, n = re.subn(r"^        CODE_SIGN_STYLE: Automatic\n", block, s, count=1, flags=re.M)
          assert n == 1, "CODE_SIGN_STYLE anchor not found in project.yml"
          p.write_text(s)
          PY
          grep -A3 'CODE_SIGN_STYLE: Manual' project.yml
          xcodegen generate

      - name: Archive
        working-directory: ios/App
        run: |
          set -e
          # No log prettifier: it can hide a codesign error and its exit code.
          xcodebuild archive \
            -project PaloAlly.xcodeproj -scheme PaloAlly -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PaloAlly.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PALOALLY_COMMIT="$(git rev-parse --short HEAD)"
          test -d "$RUNNER_TEMP/PaloAlly.xcarchive"

      - name: Export IPA
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PaloAlly.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      # altool discovers the key by filename in ~/.appstoreconnect/private_keys.
      # It returns once App Store Connect has the build; TestFlight processing
      # (usually 5–30 min) happens after, without holding the runner.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_NOTARY_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -e
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          IPA="$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY"
          echo "Uploaded PaloAlly $VERSION ($BUILD_NUMBER) to App Store Connect; it shows in TestFlight once processed." >> "$GITHUB_STEP_SUMMARY"

      - name: Report build metadata
        if: always()
        run: |
          APP="$RUNNER_TEMP/PaloAlly.xcarchive/Products/Applications/PaloAlly.app"
          [ -d "$APP" ] || exit 0
          # BuildMachineOSBuild is what ITMS-90111 checks; print it so a
          # rejection can be diagnosed from the log alone.
          plutil -p "$APP/Info.plist" | grep -E 'DTXcode|DTSDKName|BuildMachineOSBuild|CFBundleVersion|CFBundleShortVersionString'

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
