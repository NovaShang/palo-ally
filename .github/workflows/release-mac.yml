name: Release Mac app

# Builds the Mac app (Mac Catalyst), signs it with Developer ID, notarizes it,
# packages a DMG and attaches it to the GitHub Release for the tag.
# The steps themselves live in scripts/release-mac.sh, so they can be dry-run
# locally with scripts/release-mac-local.sh.
#
# Repo secrets (set them with scripts/setup-release-secrets.sh):
#   MAC_DEVID_P12_BASE64      Developer ID Application certificate + key (.p12, base64)
#   MAC_DEVID_P12_PASSWORD    its password
#   MAC_DEVID_PROFILE_BASE64  "PaloAlly Mac Developer ID" provisioning profile (base64)
#   ASC_NOTARY_KEY_ID         App Store Connect API key for notarization (Developer role)
#   ASC_NOTARY_ISSUER_ID      its issuer ID
#   ASC_NOTARY_KEY_P8_BASE64  the .p8 (base64)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 (tags the current commit v<version>)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

env:
  # The app is built and tested with Xcode 27 (iOS/macOS 27 SDK); deployment target is 26.0.
  XCODE_APP: /Applications/Xcode_27.0.app

jobs:
  release:
    # Xcode 27 is on the xcode-27 image (public preview as of 2026-10). If it is
    # unavailable, macos-26 with /Applications/Xcode_26.6.app also builds the app.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count; release notes = log since the last tag

      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$VERSION' is not x.y.z"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk macosx --show-sdk-version)
          case "$SDK" in
            2[6-9]*|[3-9][0-9]*) echo "macOS SDK $SDK" ;;
            *) echo "::error::macOS SDK $SDK is too old: the app needs the 26 SDK or newer (Liquid Glass APIs)"; exit 1 ;;
          esac
          # The avatar's .metal shaders need the Metal toolchain, a separate
          # download since Xcode 26 that runner images don't preinstall.
          xcrun -f metal >/dev/null 2>&1 && xcrun metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun metal -v

      - name: Check secrets
        env:
          P12: ${{ secrets.MAC_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVID_P12_PASSWORD }}
          PROFILE: ${{ secrets.MAC_DEVID_PROFILE_BASE64 }}
          NOTARY_ID: ${{ secrets.ASC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_NOTARY_ISSUER_ID }}
          NOTARY_P8: ${{ secrets.ASC_NOTARY_KEY_P8_BASE64 }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing MAC_DEVID_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing MAC_DEVID_P12_PASSWORD"
          [ -n "$PROFILE" ] || missing="$missing MAC_DEVID_PROFILE_BASE64"
          [ -n "$NOTARY_ID" ] || missing="$missing ASC_NOTARY_KEY_ID"
          [ -n "$NOTARY_ISSUER" ] || missing="$missing ASC_NOTARY_ISSUER_ID"
          [ -n "$NOTARY_P8" ] || missing="$missing ASC_NOTARY_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::missing repo secrets:$missing (see scripts/setup-release-secrets.sh)"
            exit 1
          fi

      - name: Signing keychain and profile
        id: sign
        env:
          P12: ${{ secrets.MAC_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVID_P12_PASSWORD }}
          PROFILE: ${{ secrets.MAC_DEVID_PROFILE_BASE64 }}
          NOTARY_P8: ${{ secrets.ASC_NOTARY_KEY_P8_BASE64 }}
        run: |
          SECRETS="$RUNNER_TEMP/secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          printf '%s' "$P12" | base64 --decode > "$SECRETS/devid.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$SECRETS/devid.provisionprofile"
          printf '%s' "$NOTARY_P8" | base64 --decode > "$SECRETS/notary.p8"

          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$SECRETS/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$SECRETS/devid.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no 'Developer ID Application' identity in MAC_DEVID_P12_BASE64"; exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "profile=$SECRETS/devid.provisionprofile" >> "$GITHUB_OUTPUT"
          echo "notary_key=$SECRETS/notary.p8" >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize, package
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
          PROFILE: ${{ steps.sign.outputs.profile }}
          NOTARY_KEY_PATH: ${{ steps.sign.outputs.notary_key }}
          NOTARY_KEY_ID: ${{ secrets.ASC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_NOTARY_ISSUER_ID }}
          OUT: ${{ runner.temp }}/release
        run: scripts/release-mac.sh

      - name: Release notes
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "HEAD^" 2>/dev/null || true)
          {
            echo "PaloAlly for Mac ${TAG#v}. Requires macOS 26 or later; signed with Developer ID and notarized by Apple."
            echo
            echo "Download **PaloAlly.dmg**, open it, and drag PaloAlly to Applications. The app pairs with a PaloAlly host (see the README for the one-line install)."
            echo
            if [ -n "$PREV" ]; then
              echo "### Changes since $PREV"
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            else
              echo "### Changes"
              git log --no-merges --pretty='- %s' -n 30
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          OUT: ${{ runner.temp }}/release
        run: |
          FILES=("$OUT/PaloAlly.dmg" "$OUT/PaloAlly-$VERSION.dmg" "$OUT/SHA256SUMS")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" \
              --title "PaloAlly $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Clean up signing material
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/release.keychain-db" ] && security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -rf "$RUNNER_TEMP/secrets"
