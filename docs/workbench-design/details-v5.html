<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>详情页</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1c1c1e;font:15px/1.5 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1320px;margin:0 auto;padding:24px 24px 90px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tabs button{font:13px -apple-system,"PingFang SC",sans-serif;padding:5px 12px;border-radius:14px;border:1px solid #d1d1d6;background:#fff;color:#1c1c1e;cursor:pointer}
.tabs button.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}.tabs i{width:12px}
h2{font-size:17px;margin:34px 0 10px}
.r{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
svg{display:block}

.L{--tx:#0b0b0c;--tx2:rgba(20,20,24,.56);--tx3:rgba(20,20,24,.3);--tile:rgba(255,255,255,.72);--hov:rgba(255,255,255,.95);--panel:rgba(236,236,239,.72);--line:rgba(0,0,0,.07);--edge:rgba(255,255,255,.85);--trk:rgba(0,0,0,.09);--ink:#2c2c30;--menu:rgba(250,250,252,.96);--wall:linear-gradient(160deg,#fdfdfe,#f1f1f4)}
.D{--tx:#fff;--tx2:rgba(235,235,245,.58);--tx3:rgba(235,235,245,.28);--tile:rgba(120,120,128,.26);--hov:rgba(140,140,150,.4);--panel:rgba(40,40,44,.7);--line:rgba(255,255,255,.09);--edge:rgba(255,255,255,.13);--trk:rgba(255,255,255,.13);--ink:#f2f2f6;--menu:rgba(56,56,60,.97);--wall:linear-gradient(160deg,#1b1b1d,#131315)}

.scene{position:relative;width:470px;min-height:660px;border-radius:16px;background:var(--wall);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1);padding:58px 45px 34px;color:var(--tx);-webkit-font-smoothing:antialiased}
.scene .ln{position:absolute;left:26px;right:26px;top:150px;bottom:20px;font-size:13px;line-height:2.5;color:var(--tx3);white-space:pre-line}
.scene .top{position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.panel{position:relative;width:380px;border-radius:30px;background:var(--panel);backdrop-filter:blur(34px) saturate(1.6);-webkit-backdrop-filter:blur(34px) saturate(1.6);box-shadow:0 18px 60px rgba(0,0,0,.2),inset 0 0 0 1px var(--edge),0 0 0 .5px rgba(0,0,0,.12);padding:14px;font-size:13px;line-height:1.3}
.ph{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--wall);box-shadow:0 0 0 1px rgba(0,0,0,.18);color:var(--tx);-webkit-font-smoothing:antialiased}
.ph .ln{position:absolute;left:22px;right:22px;top:120px;font-size:16px;line-height:2.4;color:var(--tx3);white-space:pre-line}
.ph .panel{position:absolute;left:8px;right:8px;bottom:8px;width:auto;border-radius:42px;padding:16px;font-size:15px}
.ph .gb{width:36px;height:5px;border-radius:3px;background:var(--tx3);margin:-4px auto 12px}

/* A: 控制中心 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{position:relative;border-radius:22px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--edge);transition:background .15s;overflow:visible}
button.tile:hover,.tile.hv:hover{background:var(--hov)}
.hero{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px 13px;text-align:center}
.hero .nm{font-size:16px;font-weight:700;margin-top:9px;display:flex;gap:5px;align-items:center}.ph .hero .nm{font-size:19px}
.hero .st{font-size:11.5px;color:var(--tx2);margin-top:3px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph .hero .st{font-size:14px}
.two{grid-column:span 2;padding:13px 15px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.lb{font-size:11px;color:var(--tx2)}.ph .lb{font-size:13px}
.big{font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:space-between}.ph .big{font-size:18px}
.bars{display:flex;align-items:flex-end;gap:0;height:40px;margin:0 -3px}
.bars button{flex:1;height:100%;padding:0 3px!important;display:flex;align-items:flex-end}.bars button i{display:block;width:100%;border-radius:5px;background:var(--trk);transition:background .18s}.bars button.f i{background:var(--ink)}.bars button:hover i{filter:brightness(.92)}.off{opacity:.42;pointer-events:none}.nm input{font:inherit;color:inherit;border:0;outline:0;width:120px;text-align:center;background:var(--trk);border-radius:8px;padding:1px 4px}.pen{opacity:0;color:var(--tx3)}.hero:hover .pen,.ph .pen{opacity:1}.mr{display:block;width:100%;padding:9px 13px 10px 44px!important;font-size:12px;color:var(--tx2);box-shadow:inset 0 1px 0 var(--line)}.ask{margin-top:10px;border-radius:22px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--edge);padding:13px 14px;text-align:center}.ask b{display:block}.ask .bt{display:flex;gap:8px;margin-top:10px}.ask .bt button{flex:1;height:32px;border-radius:16px;background:var(--trk);text-align:center;font-weight:600}.ph .ask .bt button{height:42px;border-radius:21px}.ask .bt .del{background:#FF3B30;color:#fff}
.four{grid-column:span 4}
.ctx{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px}
.trk{flex:1;height:8px;border-radius:4px;background:var(--trk);overflow:hidden}.trk i{display:block;height:100%;border-radius:4px;background:var(--ink);opacity:.75;transition:width .5s}
.num{font-variant-numeric:tabular-nums;color:var(--tx2);font-size:12px}.ph .num{font-size:14px}
.pill{height:28px;border-radius:14px;padding:0 12px;background:var(--trk);font-weight:600;font-size:12px;display:flex;align-items:center}.ph .pill{height:34px;border-radius:17px;font-size:14px}
.task{display:flex;align-items:center;gap:11px;padding:10px 12px 10px 13px}
.task+.task{box-shadow:inset 0 1px 0 var(--line)}
.task .b{flex:1;min-width:0}.task b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task span{font-size:11.5px;color:var(--tx2);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph .task span{font-size:13.5px}
.stop{width:26px;height:26px;border-radius:13px;background:var(--trk);display:grid;place-items:center;opacity:0;transition:opacity .15s}.task:hover .stop,.ph .stop{opacity:1}
.sq{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11.5px;font-weight:500}.ph .sq{font-size:13px}
.sq em{position:absolute;top:8px;right:9px;font-style:normal;font-size:11px;font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums}
.sq em.o{background:#FF9F0A;color:#fff;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-size:10px;top:6px;right:6px}
.end{display:block;margin:12px auto 1px;color:#FF453A;font-weight:600;padding:5px 16px!important;border-radius:14px}.end:hover{background:rgba(255,69,58,.12)}

.menu{position:absolute;z-index:20;min-width:168px;background:var(--menu);box-shadow:0 10px 34px rgba(0,0,0,.28),inset 0 0 0 .5px var(--edge);border-radius:14px;padding:5px;text-align:left}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 9px;border-radius:9px}.menu button:hover{background:var(--trk)}.ph .menu button{height:44px;font-size:17px}
.menu span{width:14px}
@keyframes sp{to{transform:rotate(360deg)}}.spin{animation:sp 1.6s linear infinite}
@keyframes bre{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}.bre{animation:bre 3.4s ease-in-out infinite;transform-origin:50% 50%}
</style></head><body><main>
<div class="tabs" id="tabs"></div>
<div class="r" id="a"></div>
<h2 id="t2">各种状态</h2><div class="r" id="b" style="gap:22px"></div>
</main>
<script>
const svg=(d,w,s=1.7)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={ud:svg('<path d="M8 10l4-4 4 4M8 14l4 4 4-4"/>',15,2.2),hist:'<circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/>',mem:'<path d="M6 4.500h10.500a1.500 1.500 0 0 1 1.500 1.500v13.500H7.500A1.500 1.500 0 0 1 6 18zM6 17.500a1.500 1.500 0 0 1 1.500-1.500H18M9.500 8.500h5M9.500 11.500h3"/>',term:'<rect x="3.500" y="5" width="17" height="14" rx="3"/><path d="M7.500 9.500l2.500 2.500-2.500 2.500M12.500 15h4"/>',perm:'<path d="M12 3.500l7 2.500v5.500c0 4.500-3 7.700-7 9-4-1.300-7-4.500-7-9V6z"/><path d="M9 12l2.200 2.200L15.300 10"/>',goal:'<circle cx="12" cy="12" r="8.500"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/>',look:'<circle cx="12" cy="12" r="8.500"/><path d="M12 3.500a8.500 8.500 0 0 1 0 17z" fill="currentColor" stroke="none" opacity=".85"/>',lang:'<circle cx="12" cy="12" r="8.500"/><path d="M3.800 12h16.400M12 3.500c2.600 2.600 3.600 5.400 3.600 8.500S14.600 17.900 12 20.500C9.400 17.900 8.400 15.100 8.400 12S9.400 6.100 12 3.500z"/>',x:svg('<path d="M8 8l8 8M16 8l-8 8"/>',14,2.400)};
let gid=0;
function orb(pal,z){const[a,b,c]=pal?['#ffb26b','#ec7a2c','#93390f']:['#f0a3dc','#b7439a','#4d1d63'],[d,e]=pal?['#ffc58e','#d9701f']:['#b9aef5','#5a43b0'],g='o'+gid++;
 return`<svg width="${z}" height="${z}" viewBox="0 0 100 100" class="${'bre'}"><defs><radialGradient id="${g}a" cx=".34" cy=".26" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".16" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient><radialGradient id="${g}b" cx=".34" cy=".28" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".3" stop-color="${d}"/><stop offset="1" stop-color="${e}"/></radialGradient></defs><ellipse cx="48" cy="90" rx="28" ry="4" fill="#000" opacity=".12"/><circle cx="45" cy="52" r="31" fill="url(#${g}a)"/><circle cx="78" cy="34" r="15" fill="url(#${g}b)"/>${pal?'<text x="45" y="63" text-anchor="middle" font-size="31" font-weight="800" fill="#fff" font-family="ui-rounded,-apple-system">?</text>':''}</svg>`;}
function ringed(pal,z,ctx,dark){const r=46,C=2*Math.PI*r,p=ctx/200,c=p>=.95?'#FF453A':p>=.8?'#FF9F0A':'var(--ink)';
 return`<div style="position:relative;width:${z}px;height:${z}px"><svg width="${z}" height="${z}" viewBox="0 0 100 100" style="position:absolute;transform:rotate(-90deg)"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--trk)" stroke-width="4"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${c}" stroke-opacity=".8" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" style="transition:stroke-dasharray .5s"/></svg><div style="position:absolute;inset:${z*.14}px">${orb(pal,z*.72)}</div></div>`;}
const spinner=`<svg width="20" height="20" viewBox="0 0 24 24" class="spin"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--trk)" stroke-width="3"/><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#0A85FF" stroke-width="3" stroke-linecap="round"/></svg>`;
const MODELS=['Fable 5.2','Opus 5.5','Sonnet 5.5','Haiku 5.5'],DEPTH=['浅','中','深','很深','最深'],PERM=['自动','每次都问','只读'],LANG=['自动','中文','English'];
const S={who:'pal',dark:false,busy:true};
const ST={usual:'平时',idle:'没任务',many:'任务多',near:'快满',full:'要满了',term:'终端里开着',limit:'额度用完',off:'连不上'};
const LN='加上了按日期排序，默认最新的在前。\n测试补了两条，构建通过。\n先别管登录页，把列表页做完。\n明白，跑一下构建看看有没有报错。\n列表页做完了。';
class P{
 constructor(host,kind,ph,st){Object.assign(this,{host,kind,ph,st:st||S.st||'usual'});this.who=S.who;this.dark=S.dark;this.name=S.who==='pal'?'网站帮手':'Palo';this.v={m:'Opus 5.5',d:2,p:'自动',l:'自动'};this.ctx={near:168,full:194}[this.st]||124;this.more=false;this.t=[['跑一遍构建和测试','2 分 3 秒 · 已跑 40 个'],['查列表页的调用方','子 agent · 1 分钟']];this.tp=[['整理本周报销单','1 小时 · 找到 5 张发票'],['订周五晚上的餐厅','等你确认几个人']];const extra=[['压测首页','后台任务 · 40 秒'],['查文章页用到的组件','子 agent · 3 分钟'],['补列表页的测试','子 agent · 5 分钟'],['对一遍设计稿','子 agent · 6 分钟']];if(this.st==='many'){this.t.push(...extra);this.tp.push(['盯回国机票','12 分钟'],['整理照片','3 分钟']);}this.draw();}
 busy(){return!['idle','limit','off'].includes(this.st);}
 tasks(){if(!this.busy()||this.st==='term')return'';const l=this.who==='pal'?this.t:this.tp,n=this.more?l.length:3,k=l.length>n;return l.slice(0,k?n:l.length).map((x,i)=>`<div class="task">${spinner}<div class="b"><b>${x[0]}</b><span>${x[1]}</span></div><button class="stop" data-stop="${i}">${I.x}</button></div>`).join('')+(k?`<button class="mr" data-more>还有 ${l.length-n} 个</button>`:'');}
 head(){const pal=this.who==='pal';const t={idle:'空闲',term:'终端里开着',limit:'额度用完，10:40 接着做',off:'连不上主机'}[this.st];return t||(pal?'等你 · ~/code/site':'在整理本周报销单');}
 A(){const pal=this.who==='pal',z=this.ph?124:112,ts=this.tasks(),off=this.st==='off',hold=off||this.st==='term';
  const sq=(i,n,e,o,k,d)=>`<button class="tile sq ${d?'off':''}" ${k?`data-menu="${k}"`:''}>${svg(I[i],this.ph?27:23)}${n}${e!=null?`<em class="${o?'o':''}">${e}</em>`:''}</button>`;
  return`<div class="grid"><div class="tile hero">${ringed(pal,z,this.ctx)}<div class="nm">${this.edit?`<input value="${this.name}">`:`<span style="width:14px"></span>${this.name}<button class="pen" data-edit>${svg('<path d="M5 19l1-4L16.500 4.500l3 3L9 18z"/>',14,1.800)}</button>`}</div><div class="st">${this.head()}</div><button class="pill ${hold?'off':''}" data-cmp style="margin-top:10px;height:${this.ph?32:26}px"><span class="num" style="margin-right:7px">${this.ctx}k / 200k</span>压缩</button></div>
  <button class="tile two ${off?'off':''}" data-menu="m"><span class="lb">模型</span><span class="big">${this.v.m}${I.ud}</span></button>
  <div class="tile two ${off?'off':''}"><span class="lb" style="display:flex;justify-content:space-between"><span>思考深度</span><b style="color:var(--tx);font-weight:650">${DEPTH[this.v.d]}</b></span><div class="bars">${DEPTH.map((d,i)=>`<button data-d="${i}" class="${i<=this.v.d?'f':''}" aria-label="${d}"><i style="height:${12+i*7}px"></i></button>`).join('')}</div></div>
  ${ts?`<div class="tile four" style="overflow:hidden">${ts}</div>`:''}
  ${pal?sq('hist','历史',23)+sq('mem','记忆',4)+sq('perm','权限',null,0,'p',off)+sq('term','终端',null,0,null,hold):sq('goal','目标',1,1)+sq('hist','历史',58)+sq('mem','记忆',5)+sq('look','设置')}
  </div>${this.ask?`<div class="ask"><b>${pal?'归档网站帮手？':'让 Palo 停下？'}</b><div class="bt"><button data-no>算了</button><button class="del" data-no>${pal?'归档':'停下'}</button></div></div>`:`<button class="end ${off?'off':''}" data-end>${pal?'归档':'停下'}</button>`}`;}
 draw(){const c=this.dark?'D':'L',in_=`<div class="panel ${this.kind==='B'?'card':''}">${this.ph&&this.kind==='A'?'<div class="gb"></div>':''}${this[this.kind]()}${this.menu||''}</div>`;
  this.host.className=(this.ph?'ph ':'scene ')+c;this.host.innerHTML=(this.ph?'':`<div class="top">${orb(this.who==='pal',42)}</div>`)+`<div class="ln">${LN}\n${LN}\n${LN}</div>`+in_;
  const inp=this.host.querySelector('.nm input');if(inp){inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter'||e.key==='Escape'){if(e.key==='Enter')this.name=inp.value.trim()||this.name;this.edit=false;this.draw();}};}
  this.host.onclick=e=>{const b=e.target.closest('[data-menu],[data-d],[data-cmp],[data-stop],[data-set],[data-more],[data-edit],[data-end],[data-no]');if(!b){if(e.target.tagName==='INPUT')return;if(this.menu||this.edit){const n=this.host.querySelector('.nm input');if(n)this.name=n.value.trim()||this.name;this.edit=false;this.menu='';this.draw();}return;}
   const s=b.dataset;if(s.d!==undefined&&!s.set){this.v.d=+s.d;}
   else if(s.stop!==undefined)(this.who==='pal'?this.t:this.tp).splice(+s.stop,1);
   else if(s.cmp!==undefined)this.ctx=31;else if(s.more!==undefined)this.more=true;else if(s.edit!==undefined)this.edit=true;else if(s.end!==undefined)this.ask=true;else if(s.no!==undefined)this.ask=false;
   else if(s.set){if(s.set==='d')this.v.d=+s.x;else this.v[s.set]=s.x;this.menu='';}
   else{const k=s.menu,p=this.host.querySelector('.panel').getBoundingClientRect(),r=b.getBoundingClientRect(),L={m:MODELS,d:DEPTH,p:PERM,l:LANG}[k];const cur=k==='d'?DEPTH[this.v.d]:this.v[k];const left=Math.min(Math.max(8,r.left-p.left),p.width-182);this.menu=`<div class="menu" style="left:${left}px;${r.bottom-p.top+L.length*30>p.height-20?`bottom:${p.bottom-r.top+6}px`:`top:${r.bottom-p.top+6}px`}">${L.map((x,i)=>`<button data-set="${k}" data-x="${k==='d'?i:x}"><span>${x===cur?svg('<path d="M5 12.500l5 5L19.500 7.500"/>',14,2.800):''}</span>${x}</button>`).join('')}</div>`;}
   this.draw();};}
}
const $=i=>document.getElementById(i);
function all(){$('tabs').innerHTML=`<button data-w="pal" class="${S.who==='pal'?'on':''}">agent</button><button data-w="palo" class="${S.who==='palo'?'on':''}">助理</button><i></i><button data-d="0" class="${S.dark?'':'on'}">浅色</button><button data-d="1" class="${S.dark?'on':''}">深色</button>`;
 $('a').innerHTML='';for(const ph of[0,1]){const d=document.createElement('div');$('a').append(d);new P(d,'A',ph,'usual');}
 $('b').innerHTML='';for(const k of Object.keys(ST).filter(k=>k!=='usual'&&!(S.who==='palo'&&k==='term'))){const f=document.createElement('figure');f.style.cssText='margin:0;zoom:.82';f.innerHTML='<div></div><figcaption style="font-size:15px;color:#57575c;margin-top:8px">'+ST[k]+'</figcaption>';$('b').append(f);new P(f.firstChild,'A',0,k);}}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.w)S.who=b.dataset.w;if(b.dataset.d)S.dark=b.dataset.d==='1';all();};
all();
</script></body></html>
