name: PaloAlly
options:
  bundleIdPrefix: com.novashang
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  PaloAllyKit:
    path: ../PaloAllyKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Device and release builds pass the short git hash; local builds say "dev".
    PALOALLY_COMMIT: dev
    # The URL scheme the app registers for pairing links. A test build passes
    # another (PALOALLY_URL_SCHEME=paloally-devtest) so the installed app keeps paloally:.
    PALOALLY_URL_SCHEME: paloally
targets:
  PaloAlly:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: Resources
      - path: Shared
    dependencies:
      - package: PaloAllyKit
      - package: PaloAllyKit
        product: PaloAllyVoice
      - package: PaloAllyKit
        product: PaloAllyFilePreview
      - package: MarkdownUI
      # The Mac only: AppKit for the window (ImmersiveWindows), loaded from PlugIns.
      - target: PaloAllyAppKit
        platformFilter: macOS
        embed: true
        codeSign: true
        copy:
          destination: plugins
      # 分享到 PaloAlly from other apps' share sheets (ShareExtension).
      # Off until the App Group group.com.novashang.paloally is registered in
      # the developer portal and assigned to com.novashang.paloally and
      # com.novashang.paloally.share (the API key's automatic signing can't
      # register groups). Then uncomment these four lines and the app's
      # application-groups entitlement below.
      # - target: PaloAllyShare
      #   platformFilter: iOS
      #   embed: true
      #   codeSign: true
    entitlements:
      path: PaloAlly.entitlements
      properties:
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
        # Shares from the extension come through this group (ShareInbox);
        # on with the extension above.
        # com.apple.security.application-groups:
        #   - group.com.novashang.paloally
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PaloAlly
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PaloAllyCommit: $(PALOALLY_COMMIT)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        # iPads and the Mac: several windows (phones still have one).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # A sidebar row dragged out of the window (iPads) opens it in a new one.
        NSUserActivityTypes:
          - com.novashang.paloally.conversation
        # A sidebar row dragged within the sidebar (reorder, into a workspace).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.novashang.paloally.sidebar-item
            UTTypeDescription: PaloAlly sidebar item
            UTTypeConformsTo:
              - public.data
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSMicrophoneUsageDescription: 语音输入时需要用到麦克风，把你说的话变成文字。
        NSSpeechRecognitionUsageDescription: 用来把你说的话转成文字，发给助理。
        NSCameraUsageDescription: 扫电脑上的二维码把这台设备连上电脑，或者拍照发给助理。
        CFBundleURLTypes:
          - CFBundleURLName: com.novashang.paloally.pair
            CFBundleURLSchemes:
              - $(PALOALLY_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novashang.paloally
        PRODUCT_NAME: PaloAlly
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Theme-colored icons (设置 → 主题色), rendered by scripts/make_icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-orchid AppIcon-rose AppIcon-berry AppIcon-blue AppIcon-violet AppIcon-teal AppIcon-orange AppIcon-graphite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Keys are the Chinese sentences; no Swift symbols are made from them.
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
  # 分享到 PaloAlly: the share sheet's extension (ShareExtension). Hands
  # what was shared to the app through the App Group (Shared/ShareInbox).
  PaloAllyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShareExtension
      - path: Shared
    entitlements:
      path: ShareExtension/PaloAllyShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.novashang.paloally
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: PaloAlly
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 6
              NSExtensionActivationSupportsFileWithMaxCount: 6
              NSExtensionActivationSupportsImageWithMaxCount: 6
              NSExtensionActivationSupportsMovieWithMaxCount: 6
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novashang.paloally.share
        PRODUCT_NAME: PaloAllyShare
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # The Mac app's AppKit bundle (ios/App/AppKitSupport), loaded at launch.
  PaloAllyAppKit:
    type: bundle
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: AppKitSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novashang.paloally.appkit
        PRODUCT_NAME: PaloAllyAppKit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: PaloAllyImmersiveWindows
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # DEBUG drills that need real touches (flings), on an iPhone simulator;
  # MacScrollWheelUITests (real scroll-wheel events) and MacLibraryUITests
  # (成果 in the inspector) and MacUpdateUITests (the update hint), on Mac Catalyst.
  PaloAllyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: PaloAlly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novashang.paloally.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # On the Mac only the Mac's own tests (the others drive an iPhone).
        EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]: "*"
        INCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]: "MacScrollWheelUITests.swift MacLibraryUITests.swift MacUpdateUITests.swift MacSmokeUITests.swift MacSplitUITests.swift"
schemes:
  PaloAlly:
    build:
      targets:
        PaloAlly: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaloAllyUITests
    archive:
      config: Release
